<!doctype html><html lang='ru'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>TajCrash PRO Demo</title><style>body{background:#081326;color:white;font:18px system-ui;text-align:center;padding:30px}button{background:#22e3ac;border:0;border-radius:14px;padding:17px 32px;font-size:20px;font-weight:bold}#rocket{font-size:90px;transition:transform .1s}#rate{font-size:48px}</style><h1>🚀 TajCrash PRO</h1><p>Демо без реальных денег</p><div id='rocket'>🚀</div><div id='rate'>1.00×</div><p id='message'>Готов к полёту</p><button id='start'>🚀 СТАРТ</button><script>let timer;document.getElementById('start').onclick=function(){clearInterval(timer);let x=1;document.getElementById('rocket').style.display='block';document.getElementById('rocket').style.transform='';document.getElementById('message').textContent='Ракета летит';document.getElementById('start').disabled=true;let target=1.5+Math.random()*3;timer=setInterval(()=>{x+=.05;document.getElementById('rate').textContent=x.toFixed(2)+'×';document.getElementById('rocket').style.transform='translateY('+(-Math.min(160,(x-1)*60))+'px)';if(x>=target){clearInterval(timer);document.getElementById('rocket').style.display='none';document.getElementById('message').textContent='💥 CRASH!';document.getElementById('start').disabled=false}},80)}</script></html>
